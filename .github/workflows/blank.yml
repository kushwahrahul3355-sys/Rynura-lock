name: Build Rynura Lock APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Rynura source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Give permission to Gradle
        run: chmod +x gradlew

      - name: Build Rynura Lock debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Upload Rynura Lock APK
        uses: actions/upload-artifact@v4
        with:
          name: Rynura-Lock-debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
